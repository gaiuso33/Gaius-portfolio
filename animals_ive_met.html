<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Animals I've met</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF1F4;--ink:#14202B;--mute:#4F6070;--card:#fff;--line:#D3DAE1;--acc:#0F6B4F;--accInk:#fff;--hi:#E8A317;--bad:#B3261E}
@media(prefers-color-scheme:dark){:root{--bg:#101820;--ink:#E6ECF1;--mute:#9BAAB8;--card:#17222C;--line:#26333F;--acc:#4FD1A1;--accInk:#08281D;--bad:#FF8A80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.6 "Bricolage Grotesque",system-ui,sans-serif}
a{color:var(--acc);font-weight:600}
:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding:1.25rem 1.5rem 4rem}
h1{font-size:clamp(2.4rem,7vw,4.2rem);line-height:1;letter-spacing:-.03em;font-weight:800;margin:2rem 0 .75rem}
.sub{color:var(--mute);margin:0 0 1.5rem;max-width:34em}
.stats{display:flex;flex-wrap:wrap;gap:1.5rem;margin:0 0 1.5rem;color:var(--mute);font-size:.95rem}.stats b{color:var(--ink);font-size:1.3rem}
.bar{display:flex;flex-wrap:wrap;gap:.6rem;margin-bottom:1.5rem}
input,select,textarea,button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:.5rem;padding:.55rem .8rem}
.bar input{flex:1;min-width:180px}
button{cursor:pointer}button.main{background:var(--acc);color:var(--accInk);border-color:var(--acc);font-weight:600}
button.danger{color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:1.25rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:.75rem;overflow:hidden;display:flex;flex-direction:column}
.ph{aspect-ratio:4/3;background:var(--line);display:grid;place-items:center;color:var(--mute);font-size:.9rem}
.ph img{width:100%;height:100%;object-fit:cover}
.body{padding:1rem 1.1rem;flex:1}
.body h3{margin:0;font-size:1.15rem}.body em{color:var(--mute);font-size:.92rem}
.meta{font-size:.88rem;color:var(--mute);margin:.5rem 0}
.body p{margin:.4rem 0 0;font-size:.95rem}
.act{display:flex;gap:.5rem;padding:0 1.1rem 1rem}.act button{padding:.3rem .7rem;font-size:.85rem}
.fav{color:var(--hi)}
.empty{grid-column:1/-1;text-align:center;padding:3rem 1rem;color:var(--mute)}
dialog{border:1px solid var(--line);border-radius:.75rem;background:var(--bg);color:var(--ink);width:min(520px,94vw);padding:1.5rem}
dialog::backdrop{background:rgba(0,0,0,.5)}
label{display:block;font-weight:600;font-size:.9rem;margin:.9rem 0 .25rem}
dialog input,dialog select,dialog textarea{width:100%}
.row{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
.preview{max-height:140px;margin-top:.5rem;border-radius:.5rem;display:block}
.foot{display:flex;gap:.6rem;justify-content:flex-end;margin-top:1.5rem}
.tools{margin-top:3rem;display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;color:var(--mute);font-size:.9rem}
#msg{min-height:1.4rem;color:var(--mute);font-size:.9rem;margin:-.75rem 0 1rem}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <a href="index.html">&larr; Back to portfolio</a>
  <h1>Animals I've met</h1>
  <p class="sub">A personal catalog of every animal I've come across, with where and when I met it.</p>
  <div class="stats" id="stats"></div>

  <div class="bar">
    <input id="q" type="search" placeholder="Search name, species, place or notes" aria-label="Search animals">
    <select id="fCat" aria-label="Filter by category"></select>
    <select id="sort" aria-label="Sort animals">
      <option value="newest">Newest added</option>
      <option value="met">Date met</option>
      <option value="name">Name A to Z</option>
    </select>
    <label style="margin:0;display:flex;align-items:center;gap:.4rem;font-weight:400"><input type="checkbox" id="fFav" style="width:auto"> Favorites</label>
    <button class="main" id="addBtn">Add an animal</button>
  </div>
  <div id="msg" role="status"></div>
  <div class="grid" id="grid"></div>

  <div class="tools">
    Your catalog is saved in this browser.
    <button id="exportBtn">Export backup</button>
    <button id="importBtn">Import backup</button>
    <input type="file" id="importFile" accept="application/json" hidden>
  </div>
</div>

<dialog id="dlg">
  <form id="form" method="dialog">
    <h2 id="dlgTitle" style="margin:0">Add an animal</h2>
    <label for="fName">Name or nickname</label><input id="fName" required>
    <div class="row">
      <div><label for="fSpecies">Species</label><input id="fSpecies" placeholder="e.g. African grey parrot"></div>
      <div><label for="fCategory">Category</label><select id="fCategory"></select></div>
    </div>
    <div class="row">
      <div><label for="fPlace">Where I met it</label><input id="fPlace"></div>
      <div><label for="fDate">When</label><input id="fDate" type="date"></div>
    </div>
    <label for="fNotes">Notes</label><textarea id="fNotes" rows="3" placeholder="What made this meeting memorable?"></textarea>
    <label for="fPhoto">Photo</label><input id="fPhoto" type="file" accept="image/*">
    <img id="prev" class="preview" alt="" hidden>
    <label style="display:flex;gap:.5rem;align-items:center;font-weight:400"><input type="checkbox" id="fFavorite" style="width:auto"> Mark as a favorite</label>
    <div class="foot"><button type="button" id="cancel">Cancel</button><button class="main" type="submit">Save animal</button></div>
  </form>
</dialog>

<script>
const CATEGORIES = ["Mammal", "Bird", "Reptile", "Amphibian", "Fish", "Insect", "Other"];
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* The catalog data type: a list of animal records with the operations you need. */
class AnimalCatalog {
  constructor(key = "animals_ive_met") {
    this.key = key;
    try { this.items = JSON.parse(localStorage.getItem(key)) || []; } catch { this.items = []; }
  }
  save() {
    try { localStorage.setItem(this.key, JSON.stringify(this.items)); return true; } catch { return false; }
  }
  add(a) { const item = { id: crypto.randomUUID(), added: Date.now(), favorite: false, photo: "", ...a }; this.items.push(item); return item; }
  get(id) { return this.items.find(a => a.id === id); }
  update(id, changes) { const a = this.get(id); if (a) Object.assign(a, changes); return a; }
  remove(id) { this.items = this.items.filter(a => a.id !== id); }
  search({ text = "", category = "", favoritesOnly = false, sortBy = "newest" } = {}) {
    const t = text.trim().toLowerCase();
    const out = this.items.filter(a =>
      (!category || a.category === category) && (!favoritesOnly || a.favorite) &&
      (!t || [a.name, a.species, a.place, a.notes].some(f => (f || "").toLowerCase().includes(t))));
    const by = { newest: (x, y) => y.added - x.added, met: (x, y) => (y.date || "").localeCompare(x.date || ""), name: (x, y) => x.name.localeCompare(y.name) };
    return out.sort(by[sortBy]);
  }
  stats() {
    const perCategory = {};
    this.items.forEach(a => perCategory[a.category] = (perCategory[a.category] || 0) + 1);
    return { total: this.items.length, species: new Set(this.items.map(a => (a.species || a.name).toLowerCase())).size, favorites: this.items.filter(a => a.favorite).length, perCategory };
  }
  toJSON() { return JSON.stringify(this.items, null, 2); }
  load(json) { const data = JSON.parse(json); if (!Array.isArray(data)) throw new Error("bad"); this.items = data; }
}

const catalog = new AnimalCatalog();
let editingId = null, photoData = "";

function note(t) { $("msg").textContent = t; setTimeout(() => { if ($("msg").textContent === t) $("msg").textContent = ""; }, 4000); }
function persist() { if (!catalog.save()) note("Could not save. Browser storage is full, so remove some photos or export a backup."); }

function render() {
  const rows = catalog.search({ text: $("q").value, category: $("fCat").value, favoritesOnly: $("fFav").checked, sortBy: $("sort").value });
  const s = catalog.stats();
  $("stats").innerHTML = `<span><b>${s.total}</b> animals</span><span><b>${s.species}</b> species</span><span><b>${s.favorites}</b> favorites</span>` +
    Object.entries(s.perCategory).map(([c, n]) => `<span><b>${n}</b> ${esc(c.toLowerCase())}</span>`).join("");
  $("grid").innerHTML = rows.length ? rows.map(a => `
    <article class="card">
      <div class="ph">${a.photo ? `<img src="${a.photo}" alt="${esc(a.name)}">` : "No photo yet"}</div>
      <div class="body">
        <h3>${esc(a.name)} ${a.favorite ? '<span class="fav" title="Favorite">&#9733;</span>' : ""}</h3>
        <em>${esc(a.species)}</em>
        <div class="meta">${esc(a.category)}${a.place ? " &middot; " + esc(a.place) : ""}${a.date ? " &middot; " + esc(a.date) : ""}</div>
        ${a.notes ? `<p>${esc(a.notes)}</p>` : ""}
      </div>
      <div class="act"><button data-a="fav" data-id="${a.id}">${a.favorite ? "Unfavorite" : "Favorite"}</button><button data-a="edit" data-id="${a.id}">Edit</button><button class="danger" data-a="del" data-id="${a.id}">Delete</button></div>
    </article>`).join("")
    : `<div class="empty">${catalog.items.length ? "No animals match your search. Clear the filters to see them all." : "Nothing here yet. Add the first animal you've met."}</div>`;
}

function openForm(a) {
  editingId = a ? a.id : null; photoData = a ? a.photo : "";
  $("dlgTitle").textContent = a ? "Edit animal" : "Add an animal";
  $("fName").value = a?.name || ""; $("fSpecies").value = a?.species || ""; $("fCategory").value = a?.category || "Mammal";
  $("fPlace").value = a?.place || ""; $("fDate").value = a?.date || ""; $("fNotes").value = a?.notes || "";
  $("fFavorite").checked = !!a?.favorite; $("fPhoto").value = "";
  $("prev").hidden = !photoData; $("prev").src = photoData;
  $("dlg").showModal();
}

/* Shrinks photos before saving so the browser storage doesn't fill up. */
function shrink(file) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 640 / Math.max(img.width, img.height)), c = document.createElement("canvas");
      c.width = img.width * k; c.height = img.height * k;
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg", 0.8));
    };
    img.onerror = rej; img.src = url;
  });
}

$("fCat").innerHTML = `<option value="">All categories</option>` + CATEGORIES.map(c => `<option>${c}</option>`).join("");
$("fCategory").innerHTML = CATEGORIES.map(c => `<option>${c}</option>`).join("");
["q", "fCat", "sort", "fFav"].forEach(id => $(id).addEventListener("input", render));
$("addBtn").onclick = () => openForm(null);
$("cancel").onclick = () => $("dlg").close();
$("fPhoto").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try { photoData = await shrink(f); $("prev").src = photoData; $("prev").hidden = false; } catch { note("That file could not be read as an image."); }
};
$("form").addEventListener("submit", () => {
  const data = { name: $("fName").value.trim(), species: $("fSpecies").value.trim(), category: $("fCategory").value, place: $("fPlace").value.trim(), date: $("fDate").value, notes: $("fNotes").value.trim(), favorite: $("fFavorite").checked, photo: photoData };
  if (editingId) catalog.update(editingId, data); else catalog.add(data);
  persist(); render(); note("Saved.");
});
$("grid").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const a = catalog.get(b.dataset.id); if (!a) return;
  if (b.dataset.a === "edit") openForm(a);
  if (b.dataset.a === "fav") { a.favorite = !a.favorite; persist(); render(); }
  if (b.dataset.a === "del" && confirm(`Delete ${a.name}? This cannot be undone.`)) { catalog.remove(a.id); persist(); render(); note("Deleted."); }
});
$("exportBtn").onclick = () => {
  const l = document.createElement("a");
  l.href = URL.createObjectURL(new Blob([catalog.toJSON()], { type: "application/json" }));
  l.download = "animals-ive-met.json"; l.click();
};
$("importBtn").onclick = () => $("importFile").click();
$("importFile").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try { catalog.load(await f.text()); persist(); render(); note("Backup imported."); } catch { note("That file isn't a valid backup."); }
  e.target.value = "";
};
render();
</script>
</body>
</html>
